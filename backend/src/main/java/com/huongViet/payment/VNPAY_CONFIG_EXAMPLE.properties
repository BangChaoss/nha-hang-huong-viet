# Copy these properties into application.properties or configure them as environment variables.
# Never commit the real hash secret to source control.
vnpay.tmn-code=${VNPAY_SANDBOX_TMN_CODE:}
vnpay.hash-secret=${VNPAY_SANDBOX_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other
# Must be a public HTTPS URL reachable by VNPAY; use a tunnel for local development.
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payments/vnpay/ipn}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
