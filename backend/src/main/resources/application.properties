spring.application.name=huong_viet_restaurant
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/huong_viet_restaurant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=root
spring.datasource.password=1313
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT Configuration =====
app.jwt.secret=${JWT_SECRET:huong-viet-restaurant-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===== Password Reset =====
app.password-reset.expiration-minutes=${RESET_TOKEN_EXPIRY:30}
app.password-reset.base-url=${RESET_BASE_URL:http://localhost:5173/reset-password}

# ===== Mail (Resend SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
# ===== Refresh Token =====
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRY:30}
app.refresh-token.retention-days=${REFRESH_TOKEN_RETENTION:30}
app.revoked-token.retention-days=${REVOKED_TOKEN_RETENTION:7}

# ===== Default Admin Account Seed =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@huongviet.com}
app.admin.phone=${ADMIN_PHONE:0999999999}
app.admin.password=${ADMIN_PASSWORD:Admin@123456}

# ===== Demo Accounts Seed =====
# Tạo sẵn 6 tài khoản demo (quanly, nhanvien, nhanvien2, dau_bep, khachhang, khachvip).
# Tắt bằng DEMO_ACCOUNTS_ENABLED=false khi triển khai môi trường thật.
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:true}

# ===== Lưu trữ ảnh (Cloudinary) =====
# Biến môi trường CLOUDINARY_URL có dạng cloudinary://<api_key>:<api_secret>@<cloud_name>
# Khi có giá trị, ảnh món ăn được đưa lên Cloudinary. Để trống thì ảnh lưu trên
# ổ đĩa cục bộ và phục vụ qua /uploads/**.
# LƯU Ý: giá trị mặc định bên dưới là tài khoản demo dùng chung cho nhóm —
# hãy đặt biến môi trường CLOUDINARY_URL riêng khi triển khai môi trường thật.
app.cloudinary.url=${CLOUDINARY_URL:cloudinary://819336383876664:fAsa2GTicPn_ZFqvj0LAji-GOCQ@db8sy6nay}
app.cloudinary.folder=${CLOUDINARY_FOLDER:huongviet/menu}

# Thư mục lưu ảnh cục bộ (dùng khi chưa cấu hình Cloudinary)
app.upload.dir=${UPLOAD_DIR:./uploads}
app.upload.public-path=${UPLOAD_PUBLIC_PATH:/uploads}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB


app.cors.allowed-origins=http://localhost:5173,http://localhost:8081

VNPAY_SANDBOX_TMN_CODE=YOUR_SANDBOX_TMN_CODE
VNPAY_SANDBOX_HASH_SECRET=YOUR_SANDBOX_HASH_SECRET

