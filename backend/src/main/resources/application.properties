spring.application.name=huong_viet_restaurant
server.port=${PORT:8080}
# ===== MySQL - nguon suy nhat cho ca ung dung lan script =====
# Script start-all.bat doc 5 dong app.db.* ben duoi de tao database va tai khoan.
# Doi o day thi ca hai deu dung gia tri moi.
app.db.host=127.0.0.1
app.db.port=3306
app.db.name=huong_viet_restaurant
app.db.username=root
app.db.password=1313

spring.datasource.url=jdbc:mysql://${app.db.host}:${app.db.port}/${app.db.name}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT Configuration =====
app.jwt.secret=${JWT_SECRET:huong-viet-restaurant-super-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ===== Password Reset =====
app.password-reset.expiration-minutes=${RESET_TOKEN_EXPIRY:30}
app.password-reset.base-url=${RESET_BASE_URL:http://localhost:5173/reset-password}

# ===== Mail (Resend SMTP) =====
spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${RESEND_API_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
# ===== Refresh Token =====
app.refresh-token.expiration-days=${REFRESH_TOKEN_EXPIRY:30}
app.refresh-token.retention-days=${REFRESH_TOKEN_RETENTION:30}
app.revoked-token.retention-days=${REVOKED_TOKEN_RETENTION:7}

# ===== Default Admin Account Seed =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@huongviet.com}
app.admin.phone=${ADMIN_PHONE:0999999999}
app.admin.password=${ADMIN_PASSWORD:Admin@123456}

# ===== Demo Accounts Seed =====
app.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:true}

